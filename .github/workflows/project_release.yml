name: Release

# After CI passes on main, release-please keeps a release pull request up to date with the next version and its
# CHANGELOG section, built from feat:/fix: commits. Merging that pull request creates the vX.Y.Z tag and the GitHub
# release; this workflow then builds and pushes the Docker images for exactly that commit, and fast-forwards dev.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # A personal token lets CI run on the release pull request; GITHUB_TOKEN works but skips that run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # After every green push to main (a release included), bring dev along, but only as a fast-forward:
  # if dev already has commits that main does not, it is left alone.
  sync-dev:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev "$SHA"; then
            git push origin "${SHA}:refs/heads/dev"
          else
            echo "::notice::dev has commits that main does not, so it was not fast-forwarded."
          fi

  images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release-please.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.release-please.outputs.version, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
