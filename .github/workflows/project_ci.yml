name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn build
      - run: yarn test
      - name: Build Docker image
        run: docker build -t orchestrarr:ci .
      - name: Run Docker runtime smoke test
        run: yarn test:docker

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full Git history (redacted output)
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          -v "$PWD/.git:/repo/.git:ro" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --log-opts="--all" --redact
