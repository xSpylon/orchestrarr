<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090a" />
    <meta name="description" content="A live view of the servers, queues, and requests behind your media library." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        const saved = localStorage.getItem('theme');
        // Dark is the default; only an explicit 'system' choice follows the device.
        const theme = saved === 'light' ? 'light' : saved === 'system' && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Orchestrarr · Media operations</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
