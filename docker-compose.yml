services:
  orchestrarr:
    image: ghcr.io/xspylon/orchestrarr:latest
    container_name: orchestrarr
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      DEMO_MODE: "false"
      AUTH_MODE: apikey
      # Leave unset and Orchestrarr generates a key on first start: it is printed in the logs and kept in the volume.
      ORCHESTRARR_API_KEY: ${ORCHESTRARR_API_KEY:-}
      ORCHESTRARR_WEBHOOK_SECRET: ${ORCHESTRARR_WEBHOOK_SECRET:-}
      # Configure integrations in Services; settings persist in the volume below.
    volumes:
      - orchestrarr_state:/app/.data
    restart: unless-stopped

volumes:
  orchestrarr_state:
